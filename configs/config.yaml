seed: 42
model:
  key: vit5
  name_or_path: VietAI/vit5-base
  pretrained_dir: vit5-base
  max_source_length: 128
  max_target_length: 128
  prefix: 'spelling: '
training:
  output_dir: experiments/vit5
  num_train_epochs: 3
  learning_rate: 0.0001
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  weight_decay: 0.01
  patience: 2
generation:
  num_beams: 4
  max_edit_distance: 2
