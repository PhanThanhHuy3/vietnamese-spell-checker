seed: 42
model:
  key: byt5
  name_or_path: google/byt5-small
  pretrained_dir: byt5-small
  max_source_length: 512
  max_target_length: 512
  prefix: 'spelling: '
training:
  output_dir: experiments/byt5
  num_train_epochs: 3
  learning_rate: 0.0001
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  weight_decay: 0.01
  patience: 2
generation:
  num_beams: 4
  max_edit_distance: 2
